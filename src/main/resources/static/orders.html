
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Management</title>

    <link rel="stylesheet" href="/css/style.css?v=3">

    <style>
        /* =========================
           Order Status Actions
        ========================= */

        .order-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .order-action-button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background-color: #e68a27;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .order-action-button:hover {
            background-color: #cf7418;
        }

        .order-action-button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        .order-action-message {
            margin-top: 10px;
            font-size: 14px;
            color: #dc3545;
        }
    </style>
</head>

<body>

<header>
    <h1>Restaurant Management System</h1>
    <p>Staff Management Dashboard</p>

    <nav>
        <a href="/index.html">Dashboard</a>
        <a href="/menu.html">Menu</a>
        <a href="/tables.html">Tables</a>
        <a href="/orders.html" class="active">Orders</a>
        <a href="/payments.html">Payments</a>
    </nav>
</header>

<main>

    <!-- Page Title -->
    <section class="welcome-section">
        <h2>Order Management</h2>
        <p>Manage restaurant orders here.</p>
    </section>

    <!-- Order List -->
    <section class="welcome-section">

        <h2>Order List</h2>

        <p id="orderCount">Loading orders...</p>

        <div id="orderList">
            Loading...
        </div>

        <p
                id="errorMessage"
                class="order-error"
                role="alert">
        </p>

    </section>

</main>

<script>

    // =========================
    // Format Amount
    // =========================

    function formatAmount(amount) {

        const value = Number(amount);

        if (!Number.isFinite(value)) {
            return '0.00';
        }

        return value.toFixed(2);
    }


    // =========================
    // Update Order Status
    // =========================

    async function updateOrderStatus(orderId, nextStatus, button) {

        const confirmed = confirm(
            `Change Order #${orderId} to ${nextStatus}?`
        );

        if (!confirmed) {
            return;
        }

        button.disabled = true;
        button.textContent = 'Updating...';

        try {

            const response = await fetch(
                `/orders/${orderId}/status?status=${encodeURIComponent(nextStatus)}`,
                {
                    method: 'PATCH'
                }
            );

            if (!response.ok) {

                let errorText = 'Failed to update order status.';

                try {
                    const errorData = await response.json();

                    if (errorData.message) {
                        errorText = errorData.message;
                    }
                } catch (error) {
                    // Use default error message.
                }

                throw new Error(errorText);
            }

            alert(`Order #${orderId} updated to ${nextStatus}.`);

            await loadOrders();

        } catch (error) {

            console.error('Order status update error:', error);

            alert(error.message);

            button.disabled = false;

            button.textContent =
                nextStatus === 'PREPARING'
                    ? 'Start Preparing'
                    : 'Complete Order';
        }
    }


    // =========================
    // Load Orders
    // =========================

    async function loadOrders() {

        const orderList =
            document.getElementById('orderList');

        const orderCount =
            document.getElementById('orderCount');

        const errorMessage =
            document.getElementById('errorMessage');

        try {

            const response = await fetch('/orders');

            if (!response.ok) {
                throw new Error('Failed to load order data.');
            }

            const orders = await response.json();

            if (!Array.isArray(orders)) {
                throw new Error('Invalid order data received.');
            }

            orderCount.textContent =
                `Total Orders: ${orders.length}`;

            orderList.replaceChildren();

            errorMessage.textContent = '';

            if (orders.length === 0) {

                orderList.textContent =
                    'No orders available.';

                return;
            }

            const orderGrid =
                document.createElement('div');

            orderGrid.className = 'order-grid';

            orders.forEach(order => {

                // Order Card
                const card =
                    document.createElement('div');

                card.className = 'order-card';

                // Order Header
                const header =
                    document.createElement('div');

                header.className = 'order-header';

                const title =
                    document.createElement('h3');

                title.textContent =
                    `Order #${order.orderId}`;

                const status =
                    document.createElement('span');

                status.className =
                    'order-status status-' +
                    String(order.status || '').toLowerCase();

                status.textContent =
                    order.status || 'UNKNOWN';

                header.appendChild(title);
                header.appendChild(status);

                // Order Information
                const info =
                    document.createElement('div');

                info.className = 'order-info';

                const session =
                    document.createElement('p');

                session.textContent =
                    `Session ID: ${order.sessionId}`;

                const employee =
                    document.createElement('p');

                employee.textContent =
                    `Employee ID: ${order.employeeId}`;

                const orderTime =
                    document.createElement('p');

                orderTime.textContent =
                    `Order Time: ${String(order.orderTime || '')
                        .replace('T', ' ')}`;

                info.appendChild(session);
                info.appendChild(employee);
                info.appendChild(orderTime);

                // Order Items
                const itemsSection =
                    document.createElement('div');

                itemsSection.className = 'order-items';

                const itemsTitle =
                    document.createElement('h4');

                itemsTitle.textContent = 'Order Items';

                itemsSection.appendChild(itemsTitle);

                if (Array.isArray(order.items)) {

                    order.items.forEach(item => {

                        const itemRow =
                            document.createElement('div');

                        itemRow.className = 'order-item';

                        const itemName =
                            document.createElement('span');

                        itemName.textContent =
                            `${item.menuName} × ${item.quantity}`;

                        const subtotal =
                            document.createElement('span');

                        subtotal.textContent =
                            formatAmount(item.subtotal);

                        itemRow.appendChild(itemName);
                        itemRow.appendChild(subtotal);

                        itemsSection.appendChild(itemRow);
                    });
                }

                // Total Amount
                const total =
                    document.createElement('div');

                total.className = 'order-total';

                total.textContent =
                    `Total: ${formatAmount(order.totalAmount)}`;

                // Order Status Actions
                const actions =
                    document.createElement('div');

                actions.className = 'order-actions';

                if (order.status === 'PENDING') {

                    const preparingButton =
                        document.createElement('button');

                    preparingButton.type = 'button';

                    preparingButton.className =
                        'order-action-button';

                    preparingButton.textContent =
                        'Start Preparing';

                    preparingButton.addEventListener('click', function() {

                        updateOrderStatus(
                            order.orderId,
                            'PREPARING',
                            preparingButton
                        );

                    });

                    actions.appendChild(preparingButton);

                } else if (order.status === 'PREPARING') {

                    const completedButton =
                        document.createElement('button');

                    completedButton.type = 'button';

                    completedButton.className =
                        'order-action-button';

                    completedButton.textContent =
                        'Complete Order';

                    completedButton.addEventListener('click', function() {

                        updateOrderStatus(
                            order.orderId,
                            'COMPLETED',
                            completedButton
                        );

                    });

                    actions.appendChild(completedButton);
                }

                // Add Elements
                card.appendChild(header);
                card.appendChild(info);
                card.appendChild(itemsSection);
                card.appendChild(total);

                if (actions.children.length > 0) {
                    card.appendChild(actions);
                }

                orderGrid.appendChild(card);
            });

            orderList.appendChild(orderGrid);

        } catch (error) {

            console.error('Order loading error:', error);

            orderCount.textContent =
                'Unable to load orders.';

            orderList.replaceChildren();

            errorMessage.textContent =
                'Failed to load order data. Please try again later.';
        }
    }


    // =========================
    // Initial Load
    // =========================

    loadOrders();

</script>

</body>
</html>
