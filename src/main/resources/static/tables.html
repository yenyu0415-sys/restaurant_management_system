
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Table Management</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/css/style.css?v=2">
</head>
<body>

<header>
    <h1>Restaurant Management System</h1>

    <nav>
        <a href="/index.html">Dashboard</a>
        <a href="/menu.html">Menu</a>
        <a href="/tables.html" class="active">Tables</a>
        <a href="/orders.html">Orders</a>
        <a href="/payments.html">Payments</a>
    </nav>
</header>

<main class="table-page">

    <!-- Page Header -->
    <div class="table-page-header">
        <div>
            <h2>Table Management</h2>
            <p>Manage restaurant tables and dining sessions.</p>
        </div>

        <button id="refreshButton" class="table-refresh-btn">
            Refresh
        </button>
    </div>

    <!-- Message -->
    <div id="message" class="table-message"></div>

    <!-- Summary -->
    <div class="table-summary">

        <div class="summary-card">
            <h3>Total Tables</h3>
            <p id="totalCount">0</p>
        </div>

        <div class="summary-card">
            <h3>Available</h3>
            <p id="availableCount">0</p>
        </div>

        <div class="summary-card">
            <h3>Occupied</h3>
            <p id="occupiedCount">0</p>
        </div>

    </div>

    <!-- Restaurant Tables -->
    <section class="table-section">
        <h3>Restaurant Tables</h3>

        <div id="tableList" class="table-grid">
            <p>Loading tables...</p>
        </div>
    </section>

</main>

<!-- JavaScript -->
<script src="/js/tables.js"></script>

</body>
</html>
