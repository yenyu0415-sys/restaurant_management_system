
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menu Management</title>

    <!-- Common CSS -->
    <link rel="stylesheet" href="/css/style.css?v=5">

    <!-- Menu JavaScript -->
    <script src="/js/menu.js" defer></script>
</head>

<body>

<!-- Header -->
<header>
    <h1>Restaurant Management System</h1>
    <p>Staff Management Dashboard</p>

    <!-- Navigation -->
    <nav>
        <a href="/index.html">Dashboard</a>
        <a href="/menu.html" class="active">Menu</a>
        <a href="/tables.html">Tables</a>
        <a href="/orders.html">Orders</a>
        <a href="/payments.html">Payments</a>
    </nav>
</header>

<!-- Main Content -->
<main>

    <!-- Page Header -->
    <section class="welcome-section">
        <h2>Menu Management</h2>
        <p>Manage restaurant menu items here.</p>
    </section>

    <!-- Menu Management -->
    <section class="welcome-section">

        <h2>Menu List</h2>

        <!-- Add Menu Form -->
        <form id="menuForm" class="menu-form">

            <h3>Add New Menu</h3>

            <input
                    type="text"
                    id="menuName"
                    placeholder="Menu Name"
                    required
            >

            <input
                    type="text"
                    id="category"
                    placeholder="Category"
                    required
            >

            <input
                    type="number"
                    id="price"
                    placeholder="Price"
                    min="1"
                    step="0.01"
                    required
            >

            <button type="submit">
                Add Menu
            </button>

        </form>

        <!-- Menu Table -->
        <table>

            <thead>
            <tr>
                <th>Menu Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody id="menuTableBody">
            <!-- Menu data loaded by menu.js -->
            </tbody>

        </table>

    </section>

</main>

</body>
</html>
